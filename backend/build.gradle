plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.bts'
version = '0.0.1-SNAPSHOT'
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform { excludeTags 'mysql', 'redis' }
}

tasks.register('redisTest', Test) {
    description = 'Real Redis queue integration tests using isolated random key prefixes.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'redis' }
}
tasks.register('mysqlTest', Test) {
    description = 'MySQL integration tests; reservation fixtures use random test-owned rows and scoped cleanup.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mysql' }
    shouldRunAfter tasks.named('test')
}

// 성능 테스트 전용 클래스는 main/test 및 운영 bootJar에 포함하지 않는다.
sourceSets {
    queuePerf {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('prepareQueuePerf') {
    dependsOn tasks.named('queuePerfClasses'), tasks.named('bootJar')
    doLast {
        def destination = layout.buildDirectory.file('queue-perf/classpath.txt').get().asFile
        destination.parentFile.mkdirs()
        destination.setText(sourceSets.queuePerf.runtimeClasspath.asPath, 'UTF-8')
        layout.buildDirectory.file('queue-perf/bootjar.txt').get().asFile.setText(tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath, 'UTF-8')
    }
}
