spring.application.name=demo-ticketing
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/demo_ticketing_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never

# Local demo sessions are separate from BTS service authentication.
demo.hold-duration=${HOLD_DURATION:PT5M}
demo.payment-identifiers=${TEST_PAYMENT_IDENTIFIERS:test-pay-shared-01,test-pay-shared-02,test-pay-shared-03}
demo.jobs.enabled=${DEMO_JOBS_ENABLED:true}
bts.enabled=${BTS_ENABLED:false}
bts.base-url=${BTS_BASE_URL:}
bts.service-id=${BTS_SERVICE_ID:demo-ticketing}
bts.api-key=${BTS_API_KEY:}
# Never infer a client IP from untrusted Forwarded/X-Forwarded-For headers.
server.forward-headers-strategy=none
