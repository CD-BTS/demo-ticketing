name: demo-ticketing

services:
  mysql:
    image: mysql:8.0
    container_name: demo-ticketing-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: demo_ticketing_db
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
    volumes:
      - demo_mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - ./db/02-booking-support.sql:/docker-entrypoint-initdb.d/30-booking-support.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --batch --skip-column-names --execute="SELECT COUNT(*) FROM concerts" >/dev/null 2>&1']
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  demo_mysql_data:
    name: demo-ticketing-mysql-data
